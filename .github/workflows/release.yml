name: Release

# Push a tag like v1.2.3 (from main) to release. Running this workflow by hand
# only rehearses the build and checks; it never publishes.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Work out the release tag
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(node -p "require('./package.json').version")"
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: Require the tag to be on main
        if: github.ref_type == 'tag'
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG is not on main. Release from main only."
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - run: npm run coverage
      - run: npm audit --audit-level=moderate
      - name: Check the tag, package version and changelog agree
        run: node scripts/release-notes.mjs "$TAG" > release-notes.md
      - name: Check the package contents
        run: node scripts/check-package.mjs
      - name: Package
        run: npx vsce package --out "spacelift-vscode-${TAG#v}.vsix"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            spacelift-vscode-*.vsix
            release-notes.md
          retention-days: 14
          if-no-files-found: error

  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Add required reviewers to this environment in the repository settings to
    # approve each release before anything is published.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          vsix=$(ls dist/spacelift-vscode-*.vsix)
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$vsix" --clobber
          else
            gh release create "$TAG" "$vsix" --title "$TAG" --notes-file dist/release-notes.md --verify-tag
          fi
      - name: Check which publishing tokens are set
        id: tokens
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          echo "vsce=$([ -n "$VSCE_PAT" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "ovsx=$([ -n "$OVSX_PAT" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Publish to the VS Code Marketplace
        if: steps.tokens.outputs.vsce == 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --packagePath dist/spacelift-vscode-*.vsix
      - name: Publish to Open VSX
        if: steps.tokens.outputs.ovsx == 'true'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --yes ovsx@1.4.0 publish dist/spacelift-vscode-*.vsix --pat "$OVSX_PAT"
      - name: Say what was skipped
        if: steps.tokens.outputs.vsce != 'true' || steps.tokens.outputs.ovsx != 'true'
        run: echo "::warning::A publishing token (VSCE_PAT or OVSX_PAT) is not set, so that registry was skipped. The GitHub release was still created."
